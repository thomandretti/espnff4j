name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Test, ktlint and detekt
        run: ./gradlew check --no-daemon

  publish:
    runs-on: ubuntu-latest
    needs: check
    # Publishing is opt-in per host: set the MAVEN_REPO_URL and MAVEN_REPO_USER repository variables
    # and a MAVEN_REPO_TOKEN secret. The version comes from the tag, so v0.2.0 publishes 0.2.0.
    if: startsWith(github.ref, 'refs/tags/v') && vars.MAVEN_REPO_URL != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Publish
        env:
          MAVEN_REPO_URL: ${{ vars.MAVEN_REPO_URL }}
          MAVEN_REPO_USER: ${{ vars.MAVEN_REPO_USER }}
          MAVEN_REPO_TOKEN: ${{ secrets.MAVEN_REPO_TOKEN }}
        run: ./gradlew publish -Pversion="${GITHUB_REF_NAME#v}" --no-daemon
