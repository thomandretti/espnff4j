name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Test, ktlint and detekt
        run: ./gradlew check --no-daemon

  # Opt-in via the repository variable below. The version comes from
  # the tag, so v0.2.0 publishes 0.2.0.
  publish-central:
    runs-on: ubuntu-latest
    needs: check
    # Set the MAVEN_CENTRAL_USERNAME variable and the MAVEN_CENTRAL_PASSWORD, SIGNING_KEY and
    # SIGNING_KEY_PASSWORD secrets: a Central Portal user token and an ASCII-armoured GPG private key.
    if: startsWith(github.ref, 'refs/tags/v') && vars.MAVEN_CENTRAL_USERNAME != ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Upload to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ vars.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_KEY_PASSWORD }}
        # Uploads and validates, then waits in the Central Portal for a manual "Publish": a release on
        # Central can never be removed. Switch to publishAndReleaseToMavenCentral once that's routine.
        run: ./gradlew publishToMavenCentral -Pversion="${GITHUB_REF_NAME#v}" --no-daemon
